# Параметры сервиса сокращения ссылок.
# Длина короткого кода в символах (без 0, O, 1, I, l).
app.code.length=6
# Срок жизни ссылки в часах. Задаётся системой, пользователь его не меняет.
app.ttl.hours=24
# Период фоновой уборки истёкших ссылок, в секундах.
app.cleanup.period.seconds=30
# Лимит переходов по умолчанию, если пользователь не указал свой.
app.default.click.limit=100
# Максимально допустимый лимит переходов.
app.max.click.limit=10000
