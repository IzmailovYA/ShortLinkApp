name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Компиляция основного кода
        run: javac -Xlint:all -d out ShortLinkApp.java
      - name: Скачивание JUnit
        run: >
          curl -L -o junit.jar
          https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
      - name: Компиляция тестов
        run: javac -cp junit.jar:out -d out-test ShortLinkAppTest.java
      - name: Запуск тестов
        run: >
          java -jar junit.jar execute
          --class-path out:out-test
          --scan-class-path
          --details=tree
